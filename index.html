<style>
/* Layout: phone-first single column; greeting header, soft white cards on a grey canvas, one dark summary card,
   job-coloured shift card, floating dark pill nav at the bottom. Widens to a centred 640px column on desktop. */
:root{
  --bg:#eceef2; --surface:#ffffff; --sunk:#f2f3f6; --line:#e3e5ea;
  --fg:#0f1014; --muted:#6a6f7e; --accent:#3a5cff; --accent-fg:#ffffff;
  --ink:#111216; --ink-fg:#ffffff; --ink-muted:#9b9fac; --ink-sunk:#26282f; --lime:#b7ea3c;
  --good:#16915a; --warn:#a96400; --bad:#d23a2e; --good-bg:#e0f4e8; --warn-bg:#fcefd8; --bad-bg:#fbe3e0;
  --shadow:0 1px 2px rgba(15,16,20,.04), 0 10px 28px rgba(15,16,20,.05);
  --f-display:"Poppins", "Segoe UI", system-ui, sans-serif;
  --f-body:"Inter", "Segoe UI", system-ui, sans-serif;
  --r:26px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b0c0f; --surface:#16171c; --sunk:#1f2026; --line:#2a2c33;
  --fg:#f2f3f6; --muted:#9a9fae; --accent:#6a84ff; --accent-fg:#ffffff;
  --ink:#1e2027; --ink-fg:#ffffff; --ink-muted:#a3a7b4; --ink-sunk:#2d3038; --lime:#c4f04f;
  --good:#5fd08f; --warn:#f0b354; --bad:#ff7d72; --good-bg:#183324; --warn-bg:#3a2d17; --bad-bg:#3d1f1c;
  --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b0c0f; --surface:#16171c; --sunk:#1f2026; --line:#2a2c33;
  --fg:#f2f3f6; --muted:#9a9fae; --accent:#6a84ff; --accent-fg:#ffffff;
  --ink:#1e2027; --ink-fg:#ffffff; --ink-muted:#a3a7b4; --ink-sunk:#2d3038; --lime:#c4f04f;
  --good:#5fd08f; --warn:#f0b354; --bad:#ff7d72; --good-bg:#183324; --warn-bg:#3a2d17; --bad-bg:#3d1f1c;
  --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:18px 6px}
.who{display:flex;align-items:center;gap:12px;min-width:0}
.avatar{width:46px;height:46px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--f-display);font-weight:600;font-size:16px;color:#fff;background:linear-gradient(135deg,#3a5cff,#8b5cf6)}
.hi{font-family:var(--f-display);font-weight:600;font-size:16px;line-height:1.2}
.sub{font-size:12.5px;color:var(--muted)}
.iconbtn{width:46px;height:46px;padding:0;display:grid;place-items:center;border-radius:50%;border:0;background:var(--surface);box-shadow:var(--shadow)}
.iconbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.iconbtn.blue{background:var(--accent);color:var(--accent-fg)}
.sync{font-size:12px;color:var(--bad);padding-bottom:4px}
h1.display{font-family:var(--f-display);font-weight:400;font-size:34px;line-height:1.12;letter-spacing:-.025em;margin:14px 0 18px;text-wrap:balance}
h1.display b{font-weight:700}
h2{font-family:var(--f-display);font-weight:600;font-size:30px;letter-spacing:-.025em;margin:14px 0 4px;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:600;font-size:17px;margin:0;text-wrap:balance}
.lede{color:var(--muted);margin:0 0 16px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.card{background:var(--surface);border:1px solid transparent;border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
:root[data-theme="dark"] .card{border-color:var(--line)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .card{border-color:var(--line)}}
.card.ink{background:var(--ink);color:var(--ink-fg);border-color:var(--ink-sunk)}
.card.ink .label,.card.ink .muted{color:var(--ink-muted)}
.card.blue{background:var(--accent);color:#fff;border-color:transparent}
.card.blue .label,.card.blue .muted{color:rgba(255,255,255,.78)}
.label{font-size:12px;color:var(--muted);font-weight:500}
.muted{color:var(--muted)}
.small{font-size:13px}
.big{font-family:var(--f-display);font-weight:600;font-size:34px;letter-spacing:-.03em;line-height:1.1}
.huge-num{font-family:var(--f-display);font-weight:600;font-size:44px;letter-spacing:-.035em;line-height:1.05}
.pence{opacity:.45}
.mid{font-family:var(--f-display);font-weight:600;font-size:22px}
button,.btn{font:inherit;font-weight:600;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:10px 18px;cursor:pointer}
button:hover{border-color:var(--muted)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--fg);color:var(--bg);border-color:var(--fg)}
button.blue{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
button.danger{color:var(--bad);border-color:var(--bad);background:transparent}
button.ghost{background:transparent;border-color:transparent;padding:6px 10px}
button:disabled{opacity:.45;cursor:not-allowed}
.onink{background:var(--ink-sunk);color:var(--ink-fg);border:1px solid rgba(255,255,255,.08);display:inline-flex;align-items:center;gap:8px;flex:1 1 0;justify-content:center;padding:11px 12px;white-space:nowrap;font-size:14px}
.onink:hover{border-color:rgba(255,255,255,.3)}
.onink svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
input,select,textarea{font:inherit;color:var(--fg);background:var(--sunk);border:1px solid var(--line);border-radius:14px;padding:10px 12px;min-width:0}
textarea{width:100%;min-height:90px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted);flex:1 1 130px;min-width:0}
label.f input,label.f select{width:100%}
/* iPhone Safari gives date/time fields a fixed native width and no height when empty */
input[type=date],input[type=time]{-webkit-appearance:none;appearance:none;display:block;min-height:46px;line-height:24px;text-align:left}
input::-webkit-date-and-time-value{text-align:left;margin:0}
/* side-by-side fields line up on their boxes even when one label wraps */
.row > label.f{align-self:stretch}
label.f > input,label.f > select{margin-top:auto}
.stack > label.f,.payset > label.f{flex:none}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.good{background:var(--good-bg);color:var(--good)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.live{background:var(--accent);color:var(--accent-fg)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.shift{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.shift:first-child{border-top:0}
.shift .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.day{padding-block:6px}
.dayhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:8px 0 2px}
.dayhead b{font-family:var(--f-display);font-weight:600;font-size:15px}
.dayhead.today b{color:var(--accent)}
.empty{color:var(--muted);font-size:13px;padding:6px 0}
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.filters button{flex:none;border:0;background:var(--surface);box-shadow:var(--shadow);padding:8px 16px;font-weight:500;font-size:14px;display:inline-flex;align-items:center;gap:7px}
.filters button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
nav.tabs{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:6;display:flex;justify-content:center;padding-inline:max(16px,env(safe-area-inset-left,0px))}
nav.tabs .in{display:flex;align-items:center;gap:2px;background:#111216;border:1px solid #2a2c33;border-radius:999px;padding:6px;box-shadow:0 12px 30px rgba(10,10,14,.28);max-width:100%}
nav.tabs button{border:0;border-radius:999px;background:transparent;color:#9b9fac;height:46px;min-width:50px;padding:0 13px;display:flex;align-items:center;justify-content:center;gap:7px;font-size:14px;font-weight:600}
nav.tabs button:hover{color:#fff}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
nav.tabs button .t{display:none}
nav.tabs button[aria-current="page"]{background:#fff;color:#111216;padding:0 18px}
nav.tabs button[aria-current="page"] .t{display:inline}
.jobcard{position:relative;border-radius:var(--r);padding:18px;color:#fff;background:color-mix(in srgb, var(--job) 86%, #000);box-shadow:0 14px 30px color-mix(in srgb, var(--job) 30%, transparent);display:flex;flex-direction:column;gap:6px}
.jc-chip{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.95);color:#111216;font-size:12.5px;font-weight:600;border-radius:999px;padding:5px 11px}
.jc-chip .pulse{width:8px;height:8px;border-radius:50%;background:var(--job)}
.jc-time{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.18);border-radius:999px;padding:6px 12px;font-weight:600;font-size:14px}
.jc-time svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.jc-name{font-family:var(--f-display);font-weight:600;font-size:40px;letter-spacing:-.03em;line-height:1.05;margin-top:12px}
.jc-when{font-size:15px;font-weight:500}
.jc-meta{font-size:13px;color:rgba(255,255,255,.8)}
.jc-btn{margin-top:10px;width:100%;border:0;background:#fff;color:#111216;padding:16px;font-size:17px;display:flex;align-items:center;justify-content:center;gap:10px}
.jc-btn:hover{background:#f1f1f4}
.jc-lock{margin-top:10px;display:flex;gap:10px;align-items:center;background:rgba(0,0,0,.2);border-radius:999px;padding:11px 16px;font-size:13.5px;font-weight:500}
.jc-lock svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8}
.lock{display:flex;gap:10px;align-items:flex-start;background:var(--sunk);border-radius:18px;padding:12px 14px;color:var(--muted);font-size:14px}
.lock svg,.chip svg{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round}
.lock svg{width:20px;height:20px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:118px;margin-top:12px}
.bars .b{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%}
.bars i{display:block;width:100%;max-width:22px;border-radius:999px;background:var(--sunk)}
.bars i.done{background:var(--lime)}
.bars i.now{background:var(--accent)}
.bars i.plan{background:color-mix(in srgb, var(--accent) 38%, var(--sunk))}
.bars i.miss{background:var(--bad-bg)}
.bars span{font-size:11px;color:var(--muted);font-weight:500}
.key{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:8px}
.key span{display:inline-flex;align-items:center;gap:4px}
.key i{width:8px;height:8px;border-radius:50%;display:inline-block}
.meter{height:10px;border-radius:6px;background:var(--sunk);overflow:hidden;display:flex}
.card.ink .meter{background:var(--ink-sunk)}
.meter i{display:block;height:100%}
.tablewrap{overflow-x:auto;margin-inline:-18px;padding-inline:18px}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:540px}
th,td{text-align:left;padding:9px 6px;border-top:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:500;border-top:0}
td.num,th.num{text-align:right}
.seg{display:inline-flex;background:var(--surface);box-shadow:var(--shadow);border-radius:999px;padding:4px}
.seg button{border:0;background:transparent;padding:7px 16px;font-size:14px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(10,11,14,.5);display:flex;align-items:flex-end;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px))}
.sheet .panel{background:var(--surface);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:28px 28px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom,0px))}
.banner{border-radius:18px;padding:12px 14px;font-size:14px}
.banner.warn{background:var(--warn-bg);color:var(--warn)}
.banner.bad{background:var(--bad-bg);color:var(--bad)}
.banner.good{background:var(--good-bg);color:var(--good)}
.drop{border:2px dashed var(--line);border-radius:20px;padding:20px;text-align:center;color:var(--muted);cursor:pointer;display:block;background:var(--sunk)}
.drop:hover{border-color:var(--accent)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs img{width:72px;height:72px;object-fit:cover;border-radius:12px;border:1px solid var(--line)}
.review{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--line)}
.review input[type=date]{flex:1 1 140px}
.review input[type=time]{flex:1 1 90px}
.review select{flex:1 1 140px}
.badge{display:inline-flex;align-items:center;justify-content:center;flex:none;border-radius:50%;color:#fff;font-family:var(--f-display);font-weight:600}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--fg);color:var(--bg);padding:11px 18px;border-radius:999px;font-weight:600;font-size:14px;max-width:calc(100% - 32px)}
@media (max-width:420px){h1.display{font-size:30px}.huge-num{font-size:38px}.big{font-size:28px}.jc-name{font-size:34px}nav.tabs button{min-width:44px;padding:0 10px}nav.tabs button[aria-current="page"]{padding:0 14px}}
@media (max-width:360px){.grid2{grid-template-columns:1fr}}
.tophero{background:var(--ink);color:var(--ink-fg);margin:0 -16px 14px;padding:18px 16px 18px;border-radius:0 0 34px 34px;display:flex;flex-direction:column;gap:18px}
.tophero .label{color:var(--ink-muted)}
.tophero .center{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;padding-top:6px}
.tophero .huge-num{font-size:48px}
.iconbtn.dark{background:var(--ink-sunk);color:var(--ink-fg);box-shadow:none;border:1px solid rgba(255,255,255,.08)}
.syncpill{margin-top:8px;display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:500;padding:6px 12px;border-radius:999px;background:var(--ink-sunk);border:1px solid rgba(255,255,255,.08)}
.syncpill i{width:7px;height:7px;border-radius:50%;background:var(--lime)}
.syncpill i.off{background:var(--bad)}
.acts{display:flex;justify-content:center;gap:22px}
.acts button{background:none;border:0;color:var(--ink-fg);display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12.5px;font-weight:500;padding:0;width:84px}
.acts .ring{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:var(--ink-sunk);border:1px solid rgba(255,255,255,.1)}
.acts .ring.main{background:#fff;color:#111216}
.acts button:hover .ring{border-color:rgba(255,255,255,.35)}
.acts svg,.mini .ic svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.mini{background:var(--ink-sunk);border:1px solid rgba(255,255,255,.06);border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:6px}
.mini b{font-family:var(--f-display);font-weight:600;font-size:20px;letter-spacing:-.02em}
.mini .ic{width:32px;height:32px;border-radius:50%;display:grid;place-items:center}
.mini .ic svg{width:17px;height:17px}
.mini .ic.in{background:color-mix(in srgb, var(--lime) 22%, transparent);color:var(--lime)}
.mini .ic.soon{background:color-mix(in srgb, #8ea2ff 22%, transparent);color:#a9b8ff}
.track{display:grid;grid-template-columns:repeat(3,1fr);margin-top:10px}
.track .st{position:relative;display:flex;flex-direction:column;gap:2px;font-size:12px;color:rgba(255,255,255,.75)}
.track .st b{color:#fff;font-weight:600;margin-top:4px}
.track i{width:22px;height:22px;border-radius:50%;border:2px solid rgba(255,255,255,.55);display:grid;place-items:center;position:relative;z-index:1;background:color-mix(in srgb, var(--job) 86%, #000)}
.track .st.on i{background:#fff;border-color:#fff;color:#111216}
.track i svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.track .st:not(:last-child)::after{content:"";position:absolute;top:10px;left:24px;right:2px;height:2px;border-radius:2px;background:rgba(255,255,255,.3)}
.track .st.on:has(+ .st.on)::after{background:#fff}

<body>
<div class="wrap">
  <header class="top" id="hdr"></header>
  <div class="sync" id="sync" hidden></div>
  <main id="view" aria-live="polite"></main>
</div>
<nav class="tabs" aria-label="Sections"><div class="in" id="tabs"></div></nav>
<div id="sheet"></div>
<div id="toast" hidden class="toast"></div>

<script>
"use strict";
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2, "0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const hm = d => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
const parseDT = (date, time) => { const [y,m,d] = date.split("-").map(Number); const [h,mi] = time.split(":").map(Number); return new Date(y, m-1, d, h, mi); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const startOfWeek = d => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); const wd = (x.getDay()+6)%7; return addDays(x, -wd); };
const DAYS = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const fmtDay = d => `${DAYS[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]}`;
const fmtTime = iso => iso ? hm(new Date(iso)) : "–";
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const hrs = mins => (mins/60).toFixed(2).replace(/\.00$/, "") + "h";
let toastT;
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2600); }

const DEFAULT_SETTINGS = {
  currency: "£", name: "", earlyMins: 15, autoOutMins: 60, alerts: false, alertMins: "60, 15",
  jobs: [
    {id:"club", name:"Thirst", rate:0, color:"#7c4ddb"},
    {id:"restaurant", name:"Avila", rate:0, color:"#d9562b"},
    {id:"store", name:"Co-op", rate:0, color:"#1d9a62"}
  ],
  budget: [
    {name:"Rent & bills", pct:50}, {name:"Savings", pct:20}, {name:"Food & transport", pct:15},
    {name:"Family & giving", pct:5}, {name:"Fun & personal", pct:10}
  ]
};

/* Settings saved before the real workplace names were known get them swapped in once. */
const OLD_NAMES = { club: "Club", restaurant: "African restaurant", store: "Supermarket" };
function renameOldJobs(st){
  let changed = false;
  if (!st.name) { st.name = DEFAULT_SETTINGS.name; changed = true; }
  for (const j of st.jobs || []) { const nu = DEFAULT_SETTINGS.jobs.find(d => d.id === j.id); if (nu && j.name === OLD_NAMES[j.id]) { j.name = nu.name; changed = true; } }
  return changed;
}

/* ---------- state ---------- */
const S = { settings: null, shifts: new Map(), tab: "today", todayJob: "", jobFilter: "", period: "week", anchor: new Date(), shiftWeek: startOfWeek(new Date()), ready: false, mode: "loading" };
try { const t = localStorage.getItem("sp.tab"); if (t) S.tab = t; } catch {}

/* ---------- storage: saved on this phone (localStorage); the claude.ai account branch stays for the old version ---------- */
const store = {
  db: null, base: null,
  async init(){
    /* Demo pages (the install guide) pass sample data in; nothing is read or saved. */
    if (window.SP_DEMO) {
      const D = window.SP_DEMO; S.mode = "demo"; S.tab = D.tab || "today";
      S.settings = { ...structuredClone(DEFAULT_SETTINGS), ...structuredClone(D.settings || {}) };
      (D.shifts || []).forEach(x => S.shifts.set(x.id, structuredClone(x)));
      setSync("Saved on this phone");
      if (!D.loading) { S.ready = true; render(); setTimeout(() => D.after?.(), 60); }
      return;
    }
    let db = null, user = null;
    /* Ask the phone to keep this app's data even when storage runs low. */
    try { await navigator.storage?.persist?.(); } catch {}
    const id = user ? await user.id().catch(() => null) : null;
    if (db && id) {
      this.db = db; S.mode = "cloud";
      this.base = db.doc(`data/users/${id}/app`);
      const loadTimer = setTimeout(() => { if (!S.ready) setSync("Can't reach your saved data yet…"); }, 10000);
      let gotSettings = false, gotShifts = false;
      const done = () => { if (gotSettings && gotShifts && !S.ready) { S.ready = true; clearTimeout(loadTimer); render(); } };
      this.base.onSnapshot(snap => {
        if (snap.exists) S.settings = { ...structuredClone(DEFAULT_SETTINGS), ...structuredClone(snap.data()) };
        else if (!S.settings) S.settings = structuredClone(DEFAULT_SETTINGS);
        if ((!snap.exists || renameOldJobs(S.settings)) && !snap.metadata.fromCache) this.saveSettings();
        if (!snap.metadata.fromCache || snap.exists) gotSettings = true;
        setSync("Saved on this phone"); done(); if (S.ready) render();
      }, e => { setSync("Sync stopped – reload the page"); });
      this.base.collection("shifts").onSnapshot(snap => {
        S.shifts = new Map(snap.docs.map(d => [d.id, { id: d.id, ...structuredClone(d.data()) }]));
        gotShifts = true; done(); if (S.ready) render();
      }, e => { setSync("Sync stopped – reload the page"); });
    } else {
      S.mode = "local";
      try {
        const raw = JSON.parse(localStorage.getItem("sp.data") || "null");
        S.settings = raw?.settings ? { ...structuredClone(DEFAULT_SETTINGS), ...raw.settings } : structuredClone(DEFAULT_SETTINGS);
        (raw?.shifts || []).forEach(s => S.shifts.set(s.id, s));
      } catch { S.settings = structuredClone(DEFAULT_SETTINGS); }
      if (renameOldJobs(S.settings)) this.persistLocal();
      setSync("Saved on this device only");
      S.ready = true; render();
    }
  },
  persistLocal(){ if (S.mode === "demo") return; try { localStorage.setItem("sp.data", JSON.stringify({ settings: S.settings, shifts: [...S.shifts.values()] })); } catch {} },
  async saveSettings(){
    if (S.mode === "cloud") { try { await this.base.set(S.settings); } catch (e) { toast("Couldn't save settings"); } }
    else this.persistLocal();
  },
  async putShift(s){
    S.shifts.set(s.id, s);
    if (S.mode === "cloud") { const { id, ...body } = s; try { await this.base.collection("shifts").doc(id).set(body); } catch (e) { toast(e?.code === "quota_exceeded" ? "Storage full – delete old shifts" : "Couldn't save shift"); } }
    else this.persistLocal();
  },
  async delShift(id){
    S.shifts.delete(id);
    if (S.mode === "cloud") { try { await this.base.collection("shifts").doc(id).delete(); } catch { toast("Couldn't delete shift"); } }
    else this.persistLocal();
  }
};
/* Only problems show; normal "saved" states stay quiet. */
function setSync(t){ const el = $("#sync"); el.textContent = t; el.hidden = S.syncOk = /^Saved/.test(t); S.syncText = t; }

/* ---------- shift logic ---------- */
const job = id => S.settings.jobs.find(j => j.id === id) || { id, name: "Unknown job", rate: 0, color: "#888" };
const money = n => `${S.settings.currency}${(Math.round(n*100)/100).toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2})}`;
function bounds(s){
  const start = parseDT(s.date, s.start); let end = parseDT(s.date, s.end);
  if (end <= start) end = addDays(end, 1); // overnight, e.g. club 22:00–04:00
  return { start, end };
}
function schedMins(s){ const { start, end } = bounds(s); return (end - start) / 60000; }
/* Pay only counts time inside the rostered shift: clocking in early pays from the roster start, staying late pays to the roster end. */
function paidMins(s){
  if (!s.in || !s.out) return 0;
  const { start, end } = bounds(s);
  const a = Math.max(new Date(s.in), start), b = Math.min(new Date(s.out), end);
  return Math.max(0, (b - a) / 60000);
}
function status(s, now = new Date()){
  const { start, end } = bounds(s);
  if (s.in && !s.out) return { key: "live", text: "Clocked in", cls: "live" };
  if (s.in && s.out) {
    const flags = [];
    if (new Date(s.in) - start > 5*60000) flags.push("late");
    if (!s.autoOut && end - new Date(s.out) > 5*60000) flags.push("left early");
    if (s.autoOut) flags.push("auto clock-out");
    return { key: "done", text: flags.length ? "Done · " + flags.join(", ") : "Done", cls: flags.length ? "warn" : "good" };
  }
  if (now >= end) return { key: "missed", text: "Missed – no clock-in", cls: "bad" };
  if (now >= start) return { key: "open", text: "Started – clock in now", cls: "warn" };
  return { key: "upcoming", text: "Upcoming", cls: "" };
}
function canClockIn(s, now = new Date()){
  if (s.in) return false;
  const { start, end } = bounds(s);
  return now >= new Date(start - S.settings.earlyMins*60000) && now < end;
}
function sortedShifts(){ return [...S.shifts.values()].sort((a, b) => bounds(a).start - bounds(b).start); }
function clashes(){
  const list = sortedShifts(), out = new Set();
  for (let i = 0; i < list.length; i++) for (let j = i+1; j < list.length; j++) {
    const A = bounds(list[i]), B = bounds(list[j]);
    if (B.start >= A.end) break;
    if (B.start < A.end && A.start < B.end) { out.add(list[i].id); out.add(list[j].id); }
  }
  return out;
}
/* Forgotten clock-outs close themselves at the roster end so pay never runs past the shift. */
async function autoClose(){
  if (!S.ready) return;
  const now = new Date();
  for (const s of S.shifts.values()) {
    if (s.in && !s.out) { const { end } = bounds(s); if (now - end > S.settings.autoOutMins*60000) await store.putShift({ ...s, out: end.toISOString(), autoOut: true }); }
  }
}
function periodRange(){
  const a = S.anchor;
  if (S.period === "week") { const s = startOfWeek(a); return { from: s, to: addDays(s, 7), label: `${fmtDay(s)} – ${fmtDay(addDays(s, 6))}` }; }
  const s = new Date(a.getFullYear(), a.getMonth(), 1); return { from: s, to: new Date(a.getFullYear(), a.getMonth()+1, 1), label: `${MONTHS[s.getMonth()]} ${s.getFullYear()}` };
}
function inRange(s, r){ const { start } = bounds(s); return start >= r.from && start < r.to; }
function earnings(r){
  const per = S.settings.jobs.map(j => ({ job: j, worked: 0, sched: 0, earned: 0, expected: 0, tips: 0, count: 0 }));
  const byId = Object.fromEntries(per.map(p => [p.job.id, p]));
  for (const s of S.shifts.values()) {
    if (!inRange(s, r)) continue;
    const p = byId[s.job]; if (!p) continue;
    const pm = paidMins(s), sm = schedMins(s);
    p.count++; p.worked += pm; p.sched += sm;
    p.earned += pm/60 * p.job.rate; p.expected += sm/60 * p.job.rate; p.tips += Number(s.tips) || 0;
  }
  const total = per.reduce((t, p) => t + p.earned + p.tips, 0);
  const expected = per.reduce((t, p) => t + p.expected + p.tips, 0);
  return { per, total, expected };
}

/* ---------- alerts: shifts go into the iPhone Calendar as a calendar file, with reminders ---------- */
const alertMinutes = () => [...new Set(String(S.settings.alertMins || "").split(/[,\s]+/).map(Number).filter(n => n > 0 && n <= 1440))].slice(0, 5);
const onCal = s => !!s.calSynced;
const icsTime = d => `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`;
const icsText = t => String(t).replace(/[\\;,]/g, m => "\\" + m).replace(/\n/g, "\\n");
function shiftsIcs(list){
  const stamp = new Date().toISOString().replace(/[-:]/g, "").replace(/\.\d+/, "");
  const ev = list.map(s => { const j = job(s.job), { start, end } = bounds(s);
    return ["BEGIN:VEVENT", `UID:${s.id}@shiftpurse`, `DTSTAMP:${stamp}`, `DTSTART:${icsTime(start)}`, `DTEND:${icsTime(end)}`,
      `SUMMARY:${icsText(`${j.name} shift${KIND[j.id] ? ` (${KIND[j.id]})` : ""}`)}`,
      `DESCRIPTION:${icsText(`Roster ${s.start}–${s.end}. Clock in on ShiftPurse when you arrive.${s.note ? "\n" + s.note : ""}`)}`,
      ...alertMinutes().flatMap(m => ["BEGIN:VALARM", "ACTION:DISPLAY", `DESCRIPTION:${icsText(`${j.name} shift in ${m >= 60 && m % 60 === 0 ? `${m / 60} hour${m === 60 ? "" : "s"}` : `${m} minutes`}`)}`, `TRIGGER:-PT${m}M`, "END:VALARM"]),
      "END:VEVENT"].join("\r\n"); });
  return ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//ShiftPurse//EN", "CALSCALE:GREGORIAN", "METHOD:PUBLISH", ...ev, "END:VCALENDAR"].join("\r\n") + "\r\n";
}
const calTodo = (list = sortedShifts()) => list.filter(s => !onCal(s) && bounds(s).end > new Date());
/* Opens the calendar file; iPhone shows "Add All" for it. Only marked as added once you say they went in. Quiet calls (after adding shifts) do nothing: a notification asks instead. */
async function calSync(list, quiet){
  if (quiet) return;
  const todo = calTodo(list);
  if (!todo.length) { toast("All upcoming shifts are already in your Calendar"); return; }
  const url = URL.createObjectURL(new Blob([shiftsIcs(todo)], { type: "text/calendar" }));
  const win = window.open(url, "_blank");
  if (!win) { const a = document.createElement("a"); a.href = url; a.download = "ShiftPurse-shifts.ics"; document.body.appendChild(a); a.click(); a.remove(); }
  openSheet(`<div class="stack"><h3>Did your shifts go in?</h3>
    <p class="small muted" style="margin:0">Your iPhone should have shown ${todo.length} shift${todo.length === 1 ? "" : "s"} with an <b>Add All</b> button. Tap it, choose your calendar, then come back here.</p>
    <div class="row"><button type="button" class="primary" id="cal-yes">Yes, they're in</button><button type="button" id="cal-again">Open again</button><button type="button" data-close="1">Not now</button></div></div>`);
  $("#cal-yes").onclick = async () => { for (const s of todo) await store.putShift({ ...S.shifts.get(s.id) || s, calSynced: true }); closeSheet(); toast(`${todo.length} shift${todo.length === 1 ? "" : "s"} in your Calendar`); render(); };
  $("#cal-again").onclick = () => { closeSheet(); calSync(list, false); };
}
/* A calendar file can't take events back out, so the app reminds you instead. */
async function calRemove(s){ if (s && onCal(s) && bounds(s).end > new Date()) toast(`Also delete ${job(s.job).name} on ${fmtDay(bounds(s).start)} from your Calendar app`); }
/* ---------- actions ---------- */
async function clockIn(id){
  const s = S.shifts.get(id);
  if (!s || !canClockIn(s)) { toast("You can only clock in during a rostered shift"); return; }
  if ([...S.shifts.values()].some(x => x.in && !x.out)) { toast("Clock out of your other shift first"); return; }
  await store.putShift({ ...s, in: new Date().toISOString() }); toast(`Clocked in at ${job(s.job).name}`); render();
}
async function clockOut(id){
  const s = S.shifts.get(id); if (!s?.in || s.out) return;
  await store.putShift({ ...s, out: new Date().toISOString() });
  const p = paidMins({ ...s, out: new Date().toISOString() });
  toast(`Clocked out · ${hrs(p)} paid · ${money(p/60*job(s.job).rate)}`); render();
}

/* ---------- views ---------- */
const ICONS = {
  today: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  shifts: '<svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>',
  pay: '<svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/><path d="M6.5 9.5v5M17.5 9.5v5"/></svg>',
  budget: '<svg viewBox="0 0 24 24"><path d="M12 3v9h9"/><path d="M20.5 15A9 9 0 1 1 9 3.5"/></svg>',

function paySheet(onlyId){
  const jobs = S.settings.jobs.filter(j => !onlyId || j.id === onlyId), today = ymd(new Date());
  openSheet(`<form id="payForm" class="stack"><div class="row between"><h3>${onlyId ? `${esc(job(onlyId).name)} paydays` : "When do you get paid?"}</h3><button type="button" class="ghost" data-close="1" aria-label="Close">✕</button></div>

      <label class="f">How often<select name="freq-${esc(j.id)}" id="pf-${esc(j.id)}"><option value="">Not set yet</option>${Object.entries(PAY_FREQ).map(([k, [l]]) => `<option value="${k}" ${p.freq === k ? "selected" : ""}>${l}</option>`).join("")}</select></label>
      <div class="row"><label class="f">Next payday<input type="date" name="next-${esc(j.id)}" id="pn-${esc(j.id)}" value="${esc(p.next || "")}" min="${today}"></label>
      <label class="f">Last day it covers<input type="date" name="cut-${esc(j.id)}" id="pc-${esc(j.id)}" value="${esc(p.cutoff || "")}"></label></div>
      <details class="gotpaid"><summary>Got paid by ${esc(j.name)} recently? Add it (optional)</summary>
        <div class="row" style="margin-top:10px"><label class="f">Amount received (${esc(S.settings.currency)})<input type="number" name="amt-${esc(j.id)}" id="pa-${esc(j.id)}" min="0" step="0.01" inputmode="decimal" placeholder="e.g. 150"></label>

    ev.preventDefault(); const f = Object.fromEntries(new FormData(ev.target));
    const plans = [], paid = [];
    for (const j of jobs) {
      const freq = f[`freq-${j.id}`], next = f[`next-${j.id}`], cutoff = f[`cut-${j.id}`], amt = Math.round(Number(f[`amt-${j.id}`]) * 100) / 100;
      if (amt > 0) paid.push({ id: uid(), job: j.id, date: f[`pd-${j.id}`] || today, amount: amt, note: "" });
      if (!freq && !next && !cutoff) { plans.push([j, null]); continue; }
      if (!freq || !next || !cutoff) { $("#payErr").textContent = `Fill in all three for ${j.name}, or leave all three empty.`; return; }
      if (cutoff > next) { $("#payErr").textContent = `For ${j.name}, the last day of work should be on or before the payday.`; return; }
      plans.push([j, { freq, next, cutoff }]);

    for (const p of paid) { payments().push(p); p.split = splitPayment(p); }
    S.settings.payAsked = true; await store.saveSettings(); closeSheet(); render();

}

/* A payday you've already logged a payment for (within 3 days of it) is done; show the one after. */
function paidAlready(j, per){ return payments().some(p => p.job === j.id && Math.abs(parseDT(p.date, "00:00") - per.payday) <= 3 * 86400000); }
function nextPeriod(j, now = new Date()){ const ps = payPeriods(j, 2, now); return ps.find(per => !paidAlready(j, per)) || ps[0]; }
/* Paydays still to come up to a date, each with its estimated amount from the roster. */
function paydaysUntil(to, now = new Date()){
  const out = [];
  for (const j of S.settings.jobs) for (const per of payPeriods(j, 15, now)) {
    if (per.payday > to) break;
    if (paidAlready(j, per)) continue;
    const m = periodPay(j, per, now); out.push({ j, per, amt: m.done + m.toCome });
  }
  return out.sort((a, b) => a.per.payday - b.per.payday);
}

/* ---------- bills & debts: planned before the split ---------- */
const bills = () => S.settings.bills || (S.settings.bills = []);
const debts = () => S.settings.debts || (S.settings.debts = []);
const lastDay = (y, m) => new Date(y, m + 1, 0).getDate();
/* Next due date of a monthly bill (due day 31 means the last day of each month). */
function billDue(b, now = new Date()){
  const t = dOnly(now), at = (y, m) => new Date(y, m, Math.min(b.dueDay, lastDay(y, m)));
  const d = at(t.getFullYear(), t.getMonth());
  return d >= t ? d : at(t.getFullYear(), t.getMonth() + 1);
}
const monthsUntil = (d, now = new Date()) => Math.max(1, (d.getFullYear() - now.getFullYear()) * 12 + d.getMonth() - now.getMonth());
const debtMonthly = x => Math.min(x.owed, x.mode === "by" && x.by ? Math.ceil(x.owed / monthsUntil(parseDT(x.by, "00:00")) * 100) / 100 : Number(x.amount) || 0);
const billsMonthly = () => bills().reduce((t, b) => t + b.amount, 0) + debts().reduce((t, x) => t + debtMonthly(x), 0);

        <button type="button" class="ghost small" data-bill="${esc(b.id)}">Edit</button></div>`; }).join("")}
    ${ds.map(x => { const m = debtMonthly(x), months = m ? Math.ceil(x.owed / m) : 0;
      return `<div class="tx"><span class="billic" style="color:var(--bad)">£</span><div class="body"><b>${esc(x.name)} · ${money(x.owed)} owed</b>
        <span class="small muted">${m ? `Paying ${money(m)} a month · cleared in about ${months} month${months === 1 ? "" : "s"}` : "No repayment plan yet"}</span>

    ${bs.length || ds.length ? `<div class="row between" style="margin-top:10px"><span class="small muted">Every month</span><b>${money(billsMonthly())}</b></div>` : ""}</div>`;

/* ---------- every logged payment is split automatically: bills and debts first, then your percentages ---------- */
const SPLIT_COLORS = ["var(--accent)", "#3f8fd2", "#d9a12b", "#c25a8f", "#7a8b80", "#5aa39b", "#a3743f"];
/* Split categories with their share. Once rent is planned as a bill, a "Rent & bills" category is skipped so rent isn't paid twice. */
function splitCats(){
  const skip = bills().length > 0;
  const cs = S.settings.budget.map((c, i) => ({ c, i, pct: skip && /rent|bill/i.test(c.name) ? 0 : Math.max(0, Number(c.pct) || 0), skipped: skip && /rent|bill/i.test(c.name) && Number(c.pct) > 0 }));
  const tot = cs.reduce((t, x) => t + x.pct, 0);
  return cs.map(x => ({ ...x, share: tot ? x.pct / tot : 0 }));
}
/* What earlier payments already put aside for one bill or debt within a cycle. */
function setAside(kind, id, from, to, exceptId){
  return payments().filter(p => p.id !== exceptId && p.split).reduce((t, p) => {
    const d = parseDT(p.date, "00:00"); if (d <= from || d > to) return t;
    return t + p.split.filter(x => x.kind === kind && x.id === id).reduce((a, x) => a + x.amount, 0);
  }, 0);
}
const r2 = n => Math.round(n * 100) / 100;
function splitPayment(p){
  const d = parseDT(p.date, "00:00"), now = new Date(), out = []; let left = p.amount;
  /* Each payment covers its fair part of what's still needed, weighted against the paydays still to come before it's due. */
  const take = (kind, id, name, need, due) => {
    if (left <= 0 || need <= 0.004) return;
    const coming = paydaysUntil(due, d > now ? d : now).reduce((t, x) => t + x.amt, 0);
    const amt = Math.min(left, r2(need * p.amount / (p.amount + coming)), r2(need));
    if (amt > 0) { out.push({ kind, id, name, amount: amt, due: ymd(due) }); left = r2(left - amt); }
  };
  for (const b of bills()) { const due = billDue(b, d); take("bill", b.id, b.name, b.amount - setAside("bill", b.id, addMonths(due, -1), due, p.id), due); }
  const mEnd = new Date(d.getFullYear(), d.getMonth() + 1, 0), mStart = new Date(d.getFullYear(), d.getMonth(), 0);
  for (const x of debts()) take("debt", x.id, x.name, debtMonthly(x) - setAside("debt", x.id, mStart, mEnd, p.id), mEnd);
  const cats = splitCats().filter(x => x.share > 0), base = left;
  cats.forEach((x, n) => { const amt = n === cats.length - 1 ? r2(left) : r2(base * x.share); if (amt > 0) { out.push({ kind: "cat", id: String(x.i), name: x.c.name, amount: amt }); left = r2(left - amt); } });
  return out;
}
/* Payments logged before this feature (or before bills were added) get split the first time they're seen. */
let splitting = false;
async function ensureSplits(){
  if (splitting || !S.ready) return;
  const todo = payments().filter(p => !p.split).sort((a, b) => a.date.localeCompare(b.date)); if (!todo.length) return;
  splitting = true; for (const p of todo) p.split = splitPayment(p);
  await store.saveSettings(); splitting = false; render();
}
const splitIcon = x => x.kind === "cat" ? `<span class="billic" style="background:${SPLIT_COLORS[Number(x.id) % SPLIT_COLORS.length]};color:#fff">${esc((x.name.match(/[A-Za-z0-9]/) || ["?"])[0].toUpperCase())}</span>`
  : `<span class="billic" ${x.kind === "debt" ? 'style="color:var(--bad)"' : ""}>${x.kind === "debt" ? "£" : esc((x.name.match(/[A-Za-z0-9]/) || ["?"])[0].toUpperCase())}</span>`;
const splitWhy = x => x.kind === "bill" ? `Put aside for ${fmtDay(parseDT(x.due, "00:00"))}` : x.kind === "debt" ? "Towards this month's repayment" : "Your split";
function splitSheet(id){
  const p = payments().find(x => x.id === id); if (!p) return;
  if (!p.split) p.split = splitPayment(p);
  const j = job(p.job), skipped = splitCats().filter(x => x.skipped);
  openSheet(`<div class="stack"><div class="row between"><h3>Where your ${money(p.amount)} goes</h3><button type="button" class="ghost" data-close="1" aria-label="Close">✕</button></div>

    ${p.split.map(x => `<div class="tx">${splitIcon(x)}<div class="body"><b>${esc(x.name)}</b><span class="small muted">${splitWhy(x)}</span></div><div class="amt"><b>${money(x.amount)}</b></div></div>`).join("")}

/* Totals of everything your logged payments have put into each pot this period. */
function potsCard(r){
  const ps = paymentsIn(r).filter(p => p.split).sort((a, b) => b.date.localeCompare(a.date)), pots = new Map();
  for (const p of ps) for (const x of p.split) { const k = x.kind + ":" + x.id, o = pots.get(k) || { ...x, amount: 0 }; o.amount = r2(o.amount + x.amount); pots.set(k, o); }
  const order = { bill: 0, debt: 1, cat: 2 }, rows = [...pots.values()].sort((a, b) => order[a.kind] - order[b.kind] || Number(a.id) - Number(b.id));
  const target = x => x.kind === "bill" ? (bills().find(b => b.id === x.id)?.amount || 0) : x.kind === "debt" ? debtMonthly(debts().find(d => d.id === x.id) || { owed: 0 }) : 0;

      return `<div class="tx">${splitIcon(x)}<div class="body"><b>${esc(x.name)}</b><span class="small muted">${x.kind === "cat" ? "Your split" : `${money(x.amount)} of ${money(t)} put aside`}</span>

      : `<p class="empty">Nothing yet. Log a payment and it's split here straight away.</p>`}
    ${ps.length ? `<div class="label" style="margin-top:12px">Payments</div>${ps.map(p => `<div class="tx">${badge(job(p.job), 36)}<div class="body"><b>${money(p.amount)} from ${esc(job(p.job).name)}</b><span class="small muted">${fmtDay(parseDT(p.date, "00:00"))}</span></div><button type="button" class="small" data-psplit="${esc(p.id)}">See split</button></div>`).join("")}` : ""}</div>`;
}

/* ---------- notifications: what needs you now, separate from settings ---------- */
const NOTE_IC = '<svg viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>';
function notices(now = new Date()){
  const out = [], list = sortedShifts(), soon = addDays(now, 1), week = 7 * 86400000;
  for (const s of list) {
    const { start, end } = bounds(s), j = job(s.job);
    if (s.in && !s.out) out.push({ j, t: `You're clocked in at ${j.name}`, d: `Roster ends ${hm(end)}. Clock out when you finish.`, act: `data-out="${s.id}"`, btn: "Clock out", dot: true });
    else if (!s.in && canClockIn(s, now)) out.push({ j, t: `Clock in at ${j.name}`, d: `${s.start}–${s.end} ${now >= start ? "has started" : "starts soon"}.`, act: `data-in="${s.id}"`, btn: "Clock in", dot: true });
    else if (!s.in && start > now && start < soon) out.push({ j, t: `${j.name} ${ymd(start) === ymd(now) ? "today" : "tomorrow"} at ${s.start}`, d: `${KIND[j.id] || "Shift"} · ${untilText(s, now).replace(/ \(.*\)$/, "")}${onCal(s) ? " · phone alert set" : ""}`, dot: true });
    else if (!s.in && end <= now && now - end < week) out.push({ j, t: `Missed ${j.name} on ${fmtDay(start)}`, d: "There was no clock-in, so it isn't counted as pay.", act: `data-edit="${s.id}"`, btn: "Edit" });
    else if (s.autoOut && now - end < 3 * 86400000) out.push({ j, t: `Auto clock-out at ${j.name}`, d: `You didn't clock out on ${fmtDay(start)}, so pay stopped at the roster end (${s.end}).` });
  }
  const cl = clashes(), clashing = list.filter(s => cl.has(s.id) && bounds(s).end > now).length;
  if (clashing) out.push({ t: `${clashing} shifts overlap`, d: "You can't be at two jobs at once. Fix the times or delete one.", act: `data-tab="shifts"`, btn: "Shifts", dot: true });
  for (const j of S.settings.jobs) {
    const per = payPeriods(j).length ? nextPeriod(j, now) : null; if (!per) continue;
    const n = daysUntil(per.payday, now);
    if (n <= 3) out.push({ j, t: `${j.name} pays you ${whenText(n).toLowerCase()}`, d: `About ${money(periodPay(j, per, now).done + periodPay(j, per, now).toCome)} before tax. Log it when it arrives.`, act: `data-act="paylog"`, btn: "Log pay", dot: true });
  }
  for (const b of bills()) { const due = billDue(b, now), n = daysUntil(due, now); if (n <= 7) out.push({ t: `${b.name} ${money(b.amount)} due ${whenText(n).toLowerCase()}`, d: `Due ${fmtDay(due)}.`, act: `data-tab="budget"`, btn: "Budget", dot: true }); }
  for (const p of payments().filter(p => p.split && now - parseDT(p.date, "00:00") < 2 * 86400000)) out.push({ j: job(p.job), t: `Your ${money(p.amount)} from ${job(p.job).name} is split`, d: p.split.slice(0, 3).map(x => `${x.name} ${money(x.amount)}`).join(" · ") + (p.split.length > 3 ? " …" : ""), act: `data-psplit="${esc(p.id)}"`, btn: "See" });
  if (!NAME_LIST().length) out.push({ t: "Add your name", d: "Put the name you appear under on rosters in Settings, so only your shifts are picked up. Restoring your old data adds it too.", act: `data-tab="settings"`, btn: "Settings" });
  const noRate = S.settings.jobs.filter(j => !j.rate);
  if (noRate.length) out.push({ t: "Add your hourly rates", d: `${noRate.map(j => j.name).join(", ")} ${noRate.length === 1 ? "has" : "have"} no rate, so pay shows £0.`, act: `data-tab="settings"`, btn: "Settings" });
  for (const j of S.settings.jobs.filter(j => !payPeriods(j).length)) out.push({ j, t: `When does ${j.name} pay you?`, d: "Set the payday to see what's coming.", act: `data-payjob="${esc(j.id)}"`, btn: "Set up" });

  if (S.shifts.size && (!S.settings.lastBackup || now - new Date(S.settings.lastBackup) > 14 * 86400000)) out.push({ t: "Back up your data", d: S.settings.lastBackup ? `Last backup ${fmtDay(new Date(S.settings.lastBackup))}. It only takes a tap.` : "Your data is only on this phone. Save a copy to Files.", act: `data-act="backup"`, btn: "Back up" });

}

/* Photos are shrunk to 1600px on the long side: plenty for handwriting, and cheaper. */
async function imageBlock(blob){
  const bmp = await createImageBitmap(blob), k = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas"); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  return { type: "image", source: { type: "base64", media_type: "image/jpeg", data: c.toDataURL("image/jpeg", 0.88).split(",")[1] } };
}
const sample = {
  async json(prompt, opts = {}){
    const key = apiKey(); if (!key) throw { code: "no_key" };
    let Anthropic; try { Anthropic = await loadSdk(); } catch { throw { code: "offline" }; }
    const client = new Anthropic({ apiKey: key, dangerouslyAllowBrowser: true, maxRetries: 2 });
    const content = [...await Promise.all((opts.images || []).map(imageBlock)), { type: "text", text: prompt }];
    let msg;
    try {

        model: "claude-opus-5-5", max_tokens: 16000,
        betas: ["server-side-fallback-2026-07-01"], fallbacks: "default",
        output_config: { effort: "high", format: { type: "json_schema", schema: ROSTER_SCHEMA } },
        messages: [{ role: "user", content }]
      }, { signal: opts.signal });
    } catch (e) {
      if (e instanceof Anthropic.APIUserAbortError || e?.name === "AbortError") throw { code: "cancelled" };
      if (e instanceof Anthropic.AuthenticationError || e instanceof Anthropic.PermissionDeniedError) throw { code: "bad_key" };
      if (e instanceof Anthropic.RateLimitError) throw { code: "rate_limited" };
      if (e instanceof Anthropic.BadRequestError && /credit|balance/i.test(e.message)) throw { code: "no_credit" };
      if (e instanceof Anthropic.APIConnectionError) throw { code: "offline" };
      throw { code: "api_error", message: e?.message };
    }
    if (msg.stop_reason === "refusal") throw { code: "refused" };
    const text = msg.content.filter(b => b.type === "text").map(b => b.text).join("");
    try { return JSON.parse(text); } catch { throw { code: "bad_reply" }; }
  }
};

function loadPdfJs(){
  if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  return pdfjsP ||= new Promise((res, rej) => {
    const sc = document.createElement("script");
    sc.src = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
    sc.onload = () => { window.pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"; res(window.pdfjsLib); };
    sc.onerror = () => rej(new Error("pdf"));
    document.head.appendChild(sc);
  });
}
async function pdfToBlobs(file, max){
  const lib = await loadPdfJs();
  const pdf = await lib.getDocument({ data: await file.arrayBuffer() }).promise;
  const out = [];
  for (let p = 1; p <= Math.min(pdf.numPages, max); p++) {
    const page = await pdf.getPage(p), vp = page.getViewport({ scale: 2 });
    const c = document.createElement("canvas"); c.width = vp.width; c.height = vp.height;
    await page.render({ canvasContext: c.getContext("2d"), viewport: vp }).promise;
    out.push(await new Promise(r => c.toBlob(r, "image/jpeg", 0.9)));
  }
  return out;
}

function rosterPrompt(jobSel, text, pages){

Today is ${DAYS[now.getDay()]} ${ymd(now)}.
The worker's jobs (use these exact ids): ${jobs.map(j => `"${j.id}" = ${j.name}${{ club: " (a club)", restaurant: " (an African restaurant)", store: " (a Co-op supermarket)" }[j.id] || ""}`).join("; ")}.
${jobSel ? `These rosters are for the job "${jobSel}". Use that id for every shift.` : `Decide which job each roster belongs to from its wording (venue name, logo, type of place). If unclear use the closest match.`}
THE WORKER: ${names.length ? names.map(n => `"${n}"`).join(" or ") : "the person who uploaded this"}. Also match close forms of those names: first name only, surname only, initials (e.g. "J. Smith", "Jane S", "J.S."), and small handwriting misspellings (e.g. "Jayne", "Smyth").

If a shift ends after midnight, keep the end time as written (e.g. 22:00 to 04:00) and use the START date.
${pages ? `The roster is in the ${pages} attached image(s).` : ""}${text ? `\nRoster text from the worker:\n"""\n${text.slice(0, 8000)}\n"""` : ""}
Reply with only JSON in this shape: {"shifts":[{"job":"club","date":"2026-11-07","start":"22:00","end":"04:00","note":""}],"warnings":["only about the worker's own shifts that were hard to read"]}`;
}
/* Notes about other staff or missing names are noise for a personal app: drop them. */
const OTHER_PEOPLE = /other (staff|people|employees|workers|names)|someone else|not the worker|name (was )?not (found|listed|visible)|could not find|couldn't find|names? (of|for) other|ignored|october|before today|earlier date/i;
async function readRoster(){
  const text = $("#i-text").value.trim(), jobSel = $("#i-job").value;
  if (!imp.blobs.length && !text) { $("#i-status").textContent = "Add photos, PDFs or some roster text first."; return; }
  const jobs = S.settings.jobs, ids = new Set(jobs.map(j => j.id)), today = ymd(new Date());
  const per = Math.max(1, Math.min(imgLimits?.maxCount || 1, 3)); // a few pages per read keeps handwriting accurate
  const batches = [];
  for (let i = 0; i < imp.blobs.length; i += per) batches.push(imp.blobs.slice(i, i + per));
  if (!batches.length) batches.push([]);
  imp.ctl = new AbortController(); imp.found = [];
  $("#i-go").disabled = true; $("#i-stop").hidden = false; $("#i-results").innerHTML = "";
  const warnings = [], seen = new Set(); let skippedPast = 0, failed = 0, lastErr = null;
  try {
    for (const [bi, imgs] of batches.entries()) {
      $("#i-status").textContent = batches.length > 1
        ? `Reading pages ${bi*per + 1}–${bi*per + imgs.length} of ${imp.blobs.length}… (${imp.found.length} of your shifts found so far)`
        : "Reading your roster… this can take up to a minute.";
      try {
        const opts = { signal: imp.ctl.signal };
        if (imgs.length) opts.images = imgs;
        const res = await sample.json(rosterPrompt(jobSel, bi === 0 ? text : "", imgs.length), opts);
        for (const x of Array.isArray(res?.shifts) ? res.shifts : []) {
          if (!/^\d{4}-\d{2}-\d{2}$/.test(x?.date) || !/^\d{1,2}:\d{2}$/.test(x?.start) || !/^\d{1,2}:\d{2}$/.test(x?.end)) continue;
          if (x.date < today) { skippedPast++; continue; }
          const f = { id: uid(), job: ids.has(x.job) ? x.job : (jobSel || jobs[0].id), date: x.date, start: x.start.padStart(5, "0"), end: x.end.padStart(5, "0"), note: String(x.note || "").slice(0, 120), source: "roster", keep: true };
          const key = `${f.job}|${f.date}|${f.start}|${f.end}`;
          if (!seen.has(key)) { seen.add(key); imp.found.push(f); }
        }
        for (const w of Array.isArray(res?.warnings) ? res.warnings : []) if (w && !OTHER_PEOPLE.test(String(w))) warnings.push(String(w));
      } catch (e) {
        if (["cancelled", "rate_limited", "no_key", "bad_key", "no_credit", "offline"].includes(e?.code)) throw e;

    if (skippedPast) bits.push(`Skipped ${skippedPast} older shift${skippedPast === 1 ? "" : "s"} (before today).`);
    if (failed) bits.push(`${failed} group${failed === 1 ? "" : "s"} of pages couldn't be read${lastErr?.code === "image_rejected" ? " (an image was rejected)" : ""}. Try those photos again, clearer if possible.`);
    $("#i-status").textContent = bits.join(" ");
  } catch (e) {
    const msg = { cancelled: "Stopped.", rate_limited: "Too many tries. Wait a minute and try again.", no_key: "Add your Claude API key in Settings first.", bad_key: "Your Claude API key wasn't accepted. Check it in Settings → Roster reading.", no_credit: "Your Claude API account is out of credit. Top it up at console.anthropic.com.", offline: "You're offline. Connect to the internet to read rosters." }[e?.code] || "Something went wrong reading the roster. Try again.";
    if (imp.found.length) renderFound(warnings);
    $("#i-status").textContent = msg + (imp.found.length ? ` ${imp.found.length} shifts were read before that.` : "");
  } finally { $("#i-go").disabled = false; $("#i-stop").hidden = true; }
}
/* A newer roster wins: a shift for the same job and day that you haven't clocked into yet is replaced by the new times. */
function matchExisting(f, skip = new Set()){
  const same = [...S.shifts.values()].filter(s => s.job === f.job && s.date === f.date && !skip.has(s.id));

  if (exact) return { kind: "dupe", s: exact };
  const old = same.find(s => !s.in);
  return old ? { kind: "update", s: old } : null;
}

    ${imp.found.map((f, i) => { const m = matchExisting(f);
      return `<div class="review"><input type="checkbox" id="k-${i}" data-fk="${i}" ${f.keep && m?.kind !== "dupe" ? "checked" : ""} aria-label="Keep this shift">

      ${m?.kind === "dupe" ? `<span class="chip">Already added</span>` : m?.kind === "update" ? `<span class="chip warn">Replaces ${esc(m.s.start)}–${esc(m.s.end)}</span>` : ""}
      ${f.note ? `<span class="small muted" style="flex-basis:100%">${esc(f.note)}</span>` : ""}</div>`; }).join("")}
    ${imp.found.length ? `<div class="row" style="margin-top:10px"><button type="button" class="primary" id="i-add">Add checked shifts</button></div>` : ""}`;
  const add = $("#i-add"); if (!add) return;
  add.onclick = async () => {
    add.disabled = true;

    for (const [i, f] of imp.found.entries()) {

    if (S.settings.alerts) calSync(added, true);

function backupData(){ return { app: "ShiftPurse", version: 1, savedAt: new Date().toISOString(), settings: S.settings, shifts: [...S.shifts.values()] }; }
function parseBackup(text){

}

  toast("Backup saved to your downloads"); render();
}

    const paid = (b.settings.payments || []).length;
    confirmSheet(`Replace what's on this phone with ${b.shifts.length} shift${b.shifts.length === 1 ? "" : "s"} and ${paid} payment${paid === 1 ? "" : "s"} from ${fmtDay(new Date(b.savedAt || Date.now()))}?`, "Restore", async () => {
      S.settings = { ...structuredClone(DEFAULT_SETTINGS), ...b.settings };
      S.shifts = new Map(b.shifts.map(x => [x.id, { ...x, calEventId: null }]));
      store.persistLocal(); toast("Restored");
    });
  };
}

/* ---------- events ---------- */
document.addEventListener("click", async ev => {
  const t = ev.target.closest("button, [data-close]"); if (!t) return;
  const d = t.dataset;
  if (d.close) { if (t.tagName === "BUTTON" || ev.target === t) closeSheet(); return; }
  if (t.closest("#notes")) closeSheet();
  if (d.tab) { S.tab = d.tab; try { localStorage.setItem("sp.tab", d.tab); } catch {} render(); window.scrollTo(0, 0); return; }
  if (d.in) return clockIn(d.in);
  if (d.out) return clockOut(d.out);
  if (d.edit) return editShift(d.edit);
  if (d.payjob) return paySheet(d.payjob);
  if (d.psplit) return splitSheet(d.psplit);
  if (d.resplit) { const p = payments().find(x => x.id === d.resplit); if (p) { p.split = splitPayment(p); await store.saveSettings(); render(); splitSheet(p.id); toast("Split again with your current budget"); } return; }
  if (d.bill !== undefined) return billSheet(d.bill || null);
  if (d.debt !== undefined) return debtSheet(d.debt || null);
  if (d.bbase) { S.budgetBase = d.bbase; return render(); }
  if (d.paydel) { const p = payments().find(x => x.id === d.paydel); if (!p) return; return confirmSheet(`Remove the ${money(p.amount)} payment from ${job(p.job).name}?`, "Remove payment", async () => { S.settings.payments = payments().filter(x => x.id !== p.id); await store.saveSettings(); }); }
  if (d.addjob !== undefined) return editShift(null, d.addjob);
  if (d.tj !== undefined) { setTodayJob(d.tj, 1); if (t.closest(".jmoney")) $("#deck")?.scrollIntoView({ behavior: "smooth", block: "center" }); return; }
  if (d.del) { const s = S.shifts.get(d.del); return confirmSheet(`Delete ${job(s.job).name} on ${fmtDay(bounds(s).start)}?`, "Delete shift", async () => { await calRemove(s); await store.delShift(d.del); }); }
  if (d.jfgo) { S.jobFilter = d.jfgo; S.tab = "shifts"; S.shiftWeek = startOfWeek(new Date()); render(); window.scrollTo(0, 0); return; }
  if (d.jf !== undefined) { S.jobFilter = d.jf; return render(); }
  if (d.wk) { S.shiftWeek = d.wk === "0" ? startOfWeek(new Date()) : addDays(S.shiftWeek, 7 * Number(d.wk)); return render(); }
  if (d.period) { S.period = d.period; S.anchor = new Date(); return render(); }
  if (d.pnav) { const n = Number(d.pnav); S.anchor = S.period === "week" ? addDays(S.anchor, 7*n) : new Date(S.anchor.getFullYear(), S.anchor.getMonth()+n, 1); return render(); }
  if (d.bdel) { S.settings.budget.splice(Number(d.bdel), 1); await store.saveSettings(); return render(); }
  if (d.jdel) { const j = S.settings.jobs[Number(d.jdel)]; return confirmSheet(`Remove ${j.name}? Its shifts stay but won't count toward pay.`, "Remove job", async () => { S.settings.jobs.splice(Number(d.jdel), 1); await store.saveSettings(); }); }
  switch (d.act) {
    case "add": return editShift(null);
    case "import": return importSheet();
    case "badd": S.settings.budget.push({ name: "New category", pct: 0 }); await store.saveSettings(); return render();
    case "jadd": S.settings.jobs.push({ id: uid(), name: "New job", rate: 0, color: "#3f8fd2" }); await store.saveSettings(); return render();
    case "wipe": return confirmSheet("Delete every shift and clock-in? This can't be undone.", "Delete everything", async () => { const now = new Date(); for (const s of [...S.shifts.values()]) { if (s.calEventId && bounds(s).end > now) await calRemove(s); await store.delShift(s.id); } });
    case "paysetup": return paySheet();
    case "paylog": return paymentSheet();
    case "notes": return notesSheet();
    case "debtask": return debtAsk();
    case "backup": return doBackup();
    case "restore": return restoreSheet();
    case "calsync": return calSync(sortedShifts(), false);
  }
});
document.addEventListener("change", async ev => {
  const t = ev.target, d = t.dataset, st = S.settings; if (!st) return;
  if (t.id === "s-key") { const v = t.value.trim(); if (v.startsWith("••")) return; try { v ? localStorage.setItem("sp.apikey", v) : localStorage.removeItem("sp.apikey"); } catch {} toast(v ? "API key saved on this phone" : "API key removed"); return render(); }
  if (d.tip) { const s = S.shifts.get(d.tip); await store.putShift({ ...s, tips: Math.max(0, Number(t.value) || 0) }); return render(); }
  if (d.bname) { st.budget[+d.bname].name = t.value.trim() || "Untitled"; }
  else if (d.bpct) { st.budget[+d.bpct].pct = Math.max(0, Math.min(100, Math.round(Number(t.value) || 0))); }
  else if (d.jname) { st.jobs[+d.jname].name = t.value.trim() || "Job"; }
  else if (d.jrate) { st.jobs[+d.jrate].rate = Math.max(0, Number(t.value) || 0); }
  else if (d.jcolor) { st.jobs[+d.jcolor].color = t.value; }
  else if (t.type === "checkbox" && d.set) { st[d.set] = t.checked; await store.saveSettings(); if (t.checked) calSync(sortedShifts(), false); return; }
  else if (d.set) { st[d.set] = ["earlyMins", "autoOutMins"].includes(d.set) ? Math.max(0, Number(t.value) || 0) : t.value.trim(); }
  else return;
  await store.saveSettings(); if (S.tab !== "settings") render(); else toast("Saved");
});

/* ---------- boot ---------- */
render();
store.init();
/* Works offline after the first visit. */
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
setInterval(() => {
  autoClose();
  const c = $(".clk"); if (c && S.tab === "today" && c.textContent !== hm(new Date()) && !$("#sheet").innerHTML) render();
}, 15000);
</script>
</body>
</html>
